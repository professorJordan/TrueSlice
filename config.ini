
#These parameters control creation of the Index File
[CreateIndex]

#The path to the text data file you want to ingest into the FAISS Vector Index
LongAnswerFile = /home/... /LongAnswers.txt

#The path to the FAISS Vector Index you want to create
NewIndexFile = /home/... /answers.index


#These parameters control the query operation
[QueryIndex]

#The path to the text data file associated with the Vector Index. We need it for data retrieval
LongAnswerFile = /home/... /LongAnswers.txt

#The path to the FAISS Vector Index you want to search
IndexFile = /home/... /answers.index

#The path to the list of questions you wish to query against the RAG System
QuestionFile = /home/... /Questions.txt

#The path to a file containing answers to the questions in the question file  
ResponseFile = /home/... /responses.txt

#The LLM to be used. Choices are mistral, llama2,  gemma2, or vicuna:7b
Model = 

#The system instruction used for the RAG prompt
SystemInstruction = You are a text selector. Given Choices and a Query, output ONLY the single best Choice verbatim.
    Do not verify facts. Do not say Not Applicable.


#These parameters control the construction of the evaluation file 
[CreateResultsFile]

#short answer file we want to compare our responses against. It could be the text file a separate file
ShortAnswerFile = /home/... /ShortAnswers.txt

#The path to a file containing answers to the questions in the question file  
ResponseFile = /home/... /responses.txt

#The path to the list of questions the LLM tried to answer
QuestionFile = /home/... /Questions.txt

#The path to the CSV that will contain short answers and responses for each question
ResultsFile = /home/... /results.csv

#These parameters control extraction of raw data 
[RawDataProcessor]

#This is the raw downloaded file
ArrowFile = /home/... /dataset.arrow

#This is the extracted short answer file
ShortAnswerFile = /home/... /ShortAnswers.txt

#This is the extracted long answer file
LongAnswerFile = /home/... /LongAnswers.txt

#This is the extracted question file
QuestionFile = /home/... /Questions.txt
